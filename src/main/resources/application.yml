spring:
  application:
    name: kiranapilot-agent

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kiranapilot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# KiranaPilot Configuration
kiranapilot:
  store:
    name: ${STORE_NAME:Sri Lakshmi Supermarket}
    gstin: ${STORE_GSTIN:33AAAPL1234C1ZV}
    address: ${STORE_ADDRESS:124 Main Bazaar, Bangalore, Karnataka - 560001}
    phone: ${STORE_PHONE:+91 98765 43210}
    state: ${STORE_STATE:Karnataka}
    state-code: ${STORE_STATE_CODE:29}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:MyKiranaPilot_bot}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:true}
  ai:
    provider: ${AI_PROVIDER:gemini} # Supported: gemini, openai, anthropic, mock
    model: ${AI_MODEL:gemini-1.5-flash}
    api-key: ${AI_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:${ANTHROPIC_API_KEY:}}}}
    temperature: ${AI_TEMPERATURE:0.1}
    max-tokens: ${AI_MAX_TOKENS:2048}
